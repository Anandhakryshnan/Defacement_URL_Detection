<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defaced URL Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
      <div class="glass-panel">
        <h1 class="heading">Defacement URL Detection</h1>
        <p class="subtitle">System Ready. Awaiting Target URL for Threat Analysis...</p>
        <form id="urlForm" method="POST" class="input-container">
            <div class="input-wrapper">
                <span class="prompt-symbol">></span>
                <input type="text" id="urlInput" name="url" placeholder="https://example.com" required autocomplete="off" />
            </div>
            <button type="submit" id="submitBtn">
                <span class="btn-text">Detect</span>
                <span class="loader hidden"></span>
            </button>
        </form>
        <div id="predictionResult" class="hidden">
            <div id="predictionText"></div>
            <ul id="reportList" class="report-list"></ul>
            <button id="resetBtn" type="button" class="btn-outline hidden">Analyze New Target</button>
        </div>
        
        <div class="threat-feed">
            <h3>[ LIVE THREAT FEED ]</h3>
            <ul id="historyList"></ul>
        </div>
      </div>
    </div>
    <footer>
    </footer>
    <script>
        // Fetch and render Threat History Feed
        async function fetchHistory() {
            try {
                const res = await fetch('/history');
                const data = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    const colorClass = item.prediction.toLowerCase().includes('defacement') ? 'feed-danger' : 'feed-success';
                    // Format timestamp (assume UTC, convert to local)
                    let timeStr = new Date(item.timestamp + 'Z').toLocaleTimeString();
                    if(timeStr === 'Invalid Date') timeStr = item.timestamp;
                    li.innerHTML = `<span class="time">[${timeStr}]</span> <span class="${colorClass}">${item.prediction.toUpperCase()}</span>: ${item.url}`;
                    list.appendChild(li);
                });
            } catch(e) {
                console.error("Failed to fetch history", e);
            }
        }
        
        // Initial fetch and auto-refresh every 5 seconds
        fetchHistory();
        setInterval(fetchHistory, 5000);

        document.getElementById('urlForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');
            const resultDiv = document.getElementById('predictionResult');
            const resultText = document.getElementById('predictionText');
            const reportList = document.getElementById('reportList');
            const resetBtn = document.getElementById('resetBtn');
            
            // Show loading state
            btn.disabled = true;
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            resultDiv.classList.remove('success', 'danger');
            reportList.innerHTML = '';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();
                
                if(data.error) { throw new Error(data.error); }
                
                resultText.innerText = `[Result]: ${data.prediction}`;
                
                // Populate Explainable AI Report
                if(data.report) {
                    data.report.forEach(msg => {
                        const li = document.createElement('li');
                        li.innerText = '> ' + msg;
                        reportList.appendChild(li);
                    });
                }
                
                // Transition UI state
                form.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                resetBtn.classList.remove('hidden');
                
                if (data.prediction.toLowerCase().includes('defacement') || data.prediction.toLowerCase().includes('phishing') || data.prediction.toLowerCase().includes('malware')) {
                    resultDiv.classList.add('danger');
                } else {
                    resultDiv.classList.add('success');
                }
                
                // Update feed immediately
                fetchHistory();
                
            } catch (err) {
                resultText.innerText = '[Error]: ' + err.message;
                form.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                resultDiv.classList.add('danger');
                resetBtn.classList.remove('hidden');
            } finally {
                // Restore button state
                btn.disabled = false;
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('urlForm').classList.remove('hidden');
            document.getElementById('predictionResult').classList.add('hidden');
            document.getElementById('urlInput').value = '';
            document.getElementById('reportList').innerHTML = '';
        });
    </script>
    <script src="{{ url_for('static', filename='particles.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
